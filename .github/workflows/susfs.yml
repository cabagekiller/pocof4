name: Kernel Build (munch) - SUSFS + KSU NEXT | clang-r547379

on:
  pull_request:
  workflow_dispatch:
    inputs:
      BUILD_TITLE:
        description: 'Custom Build Title'
        required: false
      KERNEL_TREE:
        description: 'Kernel Tree'
        default: 'https://github.com/cabagekiller/pocof4'
        required: true
      KERNEL_TREE_BRANCH:
        description: 'Kernel Tree Branch'
        required: true
        default: 'susfs-next'
      CODENAME:
        description: 'Phone Codename'
        default: 'munch'
        required: true
      ANYKERNEL_URL:
        description: 'AnyKernel Url (leave blank if you dont want AnyKernel)'
        default: 'https://github.com/DjSenseii1/f4aosp'
        required: false
      ANYKERNEL_BRANCH:
        description: 'AnyKernel Branch (defaults to codename)'
        default: 'main'
        required: false
      SECOND_ANYKERNEL_URL:
        description: 'Second AnyKernel Url (leave blank if you dont want AnyKernel)'
        default: 'https://github.com/DjSenseii1/miui-hyperF4'
        required: false
      SECOND_ANYKERNEL_BRANCH:
        description: 'Second AnyKernel Branch (defaults to codename)'
        default: 'main'
        required: false
      UPLOAD_TO_RELEASE:
        description: 'Upload to release'
        type: boolean
        default: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Display User Inputs
        run: |
          echo "::group::User Environment Variables"
          echo "Custom Build Title: ${{ github.event.inputs.BUILD_TITLE }}"
          echo "Kernel Tree: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}"
          echo "Codename: ${{ env.CODENAME }}"
          echo "AnyKernel Url: ${{ github.event.inputs.ANYKERNEL_URL }}/tree/${{ github.event.inputs.ANYKERNEL_BRANCH }}"
          echo "Second AnyKernel Url: ${{ github.event.inputs.SECOND_ANYKERNEL_URL }}/tree/${{ github.event.inputs.SECOND_ANYKERNEL_BRANCH }}"
          echo "::endgroup::"

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq \
            python3-pip \
            curl \
            git \
            zip \
            unzip \
            gcc \
            g++ \
            make \
            ninja-build \
            file \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            wget \
            build-essential \
            python3-dev \
            python3-setuptools \
            rsync \
            ccache \
            llvm-dev \
            libncurses6

      - name: Cache Clang
        id: clang-cache
        uses: actions/cache@v3
        with:
          path: clang
          key: clang-${{ hashFiles('clang.tar.gz') }}
          restore-keys: clang-

      - name: Set up Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz -O clang.tar.gz
          mkdir -p clang
          tar -xf clang.tar.gz -C clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 ${{ github.event.inputs.KERNEL_TREE }} -b ${{ github.event.inputs.KERNEL_TREE_BRANCH }} kernel_tree
          echo "kernel-folder=$(pwd)/kernel_tree" >> $GITHUB_OUTPUT
        id: kernel

      - name: Build kernel
        run: |
          set -e # Exit on error
          set -x # Enable debugging (optional)

          # Run custom script (if needed)
          bash ksu.sh

          # Set environment variables
          export ARCH=arm64
          export KBUILD_BUILD_USER="cabagekiller"
          export KBUILD_BUILD_HOST="Github"

          # Create artifacts directory
          mkdir -p artifacts

          # Generate defconfig
          make O=out vendor/munch_defconfig V=1 PATH="${{ steps.tools.outputs.tools-folder }}/clang/bin:$PATH"

          # Build kernel
          make O=out V=1 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc --all) \
              PATH="${{ steps.tools.outputs.tools-folder }}/clang/bin:$PATH" \
              CROSS_COMPILE=aarch64-linux-gnu- > artifacts/build_log.txt 2>&1

          # Find object files (optional)
          find out -name "*.o" -o -name "*.a" > artifacts/object_files.txt
                  working-directory: ${{ env.KERNEL_FOLDER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/Image.gz
            ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/dtb
            ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/dtbo.img

      - name: Build AnyKernel
        if: ${{ success() && github.event.inputs.ANYKERNEL_URL != '' }}
        run: |
          git clone --recursive --depth=1 ${{ github.event.inputs.ANYKERNEL_URL }} -b ${{ github.event.inputs.ANYKERNEL_BRANCH || env.CODENAME }} AnyKernel
          cp -f Image.gz AnyKernel/
          if [ -e "dtb.img" ]; then
            mv -f dtb.img dtb
            cp -f dtb AnyKernel/dtb
          fi
          if [ -e "dtbo.img" ]; then
            cp -f dtbo.img AnyKernel/
          fi
          cd AnyKernel
          zip -q -r N0kernel-AOSP-KSUNEXT-SUSFS-${{ env.CODENAME }}.zip *
          mv N0kernel-AOSP-KSUNEXT-SUSFS-${{ env.CODENAME }}.zip ../
        working-directory: ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/

      - name: Build Second AnyKernel
        if: ${{ success() && github.event.inputs.SECOND_ANYKERNEL_URL != '' }}
        run: |
          git clone --recursive --depth=1 ${{ github.event.inputs.SECOND_ANYKERNEL_URL }} -b ${{ github.event.inputs.SECOND_ANYKERNEL_BRANCH || env.CODENAME }} SecondAnyKernel
          cp -f Image.gz SecondAnyKernel/
          if [ -e "dtb" ]; then
            cp -f dtb SecondAnyKernel/dtb
          fi
          cd SecondAnyKernel
          zip -q -r N0kernel-HYPEROS-KSUNEXT-SUSFS-${{ env.CODENAME }}.zip *
          mv N0kernel-HYPEROS-KSUNEXT-SUSFS-${{ env.CODENAME }}.zip ../
        working-directory: ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/

      - name: Upload to Release
        if: ${{ github.event.inputs.UPLOAD_TO_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/N0kernel-AOSP-KSUNEXT-SUSFS-${{ env.CODENAME }}.zip
            ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/N0kernel-HYPEROS-KSUNEXT-SUSFS-${{ env.CODENAME }}.zip
          name: ${{ env.CODENAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            <b>${{ github.event.inputs.BUILD_TITLE || env.CODENAME }}</b>
            <b>Kernel successfully built!</b>, took ${{ steps.build.outputs.elapsed_time }} seconds.
            
            <b>Kernel tree</b>: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}
            <b>Action</b>: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "::group::Build Summary"
          echo "Build completed in ${{ steps.build.outputs.elapsed_time }} seconds."
          echo "Kernel tree: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}"
          echo "Artifacts:"
          ls -l ${{ env.KERNEL_FOLDER }}/out/arch/arm64/boot/
          echo "::endgroup::"
